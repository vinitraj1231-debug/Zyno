<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Zynochat Support</title>
  <meta name="description" content="Get in touch with Zynochat.in engineering team for technical feedback, security vulnerability disclosures, or partnership inquiries.">
  <link rel="canonical" href="https://zynochat.in/contact-us">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-black text-white">Zynochat<span class="text-indigo-500">.in</span></a>
      <nav class="flex items-center gap-4 text-xs font-semibold">
        <a href="/" class="hover:text-indigo-400">Home</a>
        <a href="/about-us" class="hover:text-indigo-400">About</a>
        <a href="/contact-us" class="text-indigo-400">Contact</a>
        <a href="/privacy-policy" class="hover:text-indigo-400">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12 flex-grow space-y-8">
    <div class="border-b border-slate-800 pb-6 text-center">
      <h1 class="text-3xl font-black text-white">Contact Zynochat Engineering</h1>
      <p class="text-xs text-slate-400 mt-2">Primary Email: <a href="mailto:support@zynochat.in" class="text-indigo-400 font-mono underline">support@zynochat.in</a></p>
    </div>

    <form class="p-6 bg-slate-900 border border-slate-800 rounded-2xl space-y-4 max-w-xl mx-auto text-xs">
      <div class="space-y-1">
        <label class="font-bold text-slate-300">Full Name</label>
        <input type="text" required placeholder="John Doe" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white">
      </div>
      <div class="space-y-1">
        <label class="font-bold text-slate-300">Email Address</label>
        <input type="email" required placeholder="john@example.com" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white">
      </div>
      <div class="space-y-1">
        <label class="font-bold text-slate-300">Message</label>
        <textarea rows="4" required placeholder="Your technical message..." class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition">Submit Message</button>
    </form>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-wrap justify-between items-center gap-4">
      <p>© 2026 Zynochat.in — All rights reserved.</p>
      <div class="flex gap-4">
        <a href="/privacy-policy" class="hover:text-white">Privacy Policy</a>
        <a href="/terms-and-conditions" class="hover:text-white">Terms</a>
        <a href="/disclaimer" class="hover:text-white">Disclaimer</a>
        <a href="/cookie-policy" class="hover:text-white">Cookie Policy</a>
        <a href="/dmca" class="hover:text-white">DMCA</a>
      </div>
    </div>
  </footer>
</body>
</html>
